<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="skill-card">
        <header class="skill-card__header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/HTML5_Badge.svg" alt="HTML5 Logo" class="skill-card__icon">
        </header>
        <section class="skill-card__body">
            <h2 class="skill-card__title">html</h2>
            <span class="skill-card__duration">6 ans d'expérience</span>
            <ul class="skill-card__knowledge">
                <li>HTML5</li>
                <li>Sémantique</li>
                <li>SVG</li>
                <li>Canvas</li>
            </ul>
        </section>
    </div>
</body>
</html>
