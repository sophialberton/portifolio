name: Generate Repository Metrics

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. Alteração aqui: Faz o download completo do repositório
      - name: Checkout full repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # O '0' força o download do histórico completo

      # 2. Gera o gráfico
      - name: Generate repository metrics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" 
          plugin_languages: yes
          plugin_languages_threshold: 0%
          plugin_languages_limit: 8
          
          # Alteração aqui: Muda o visual para o estilo de barra clássico
          plugin_languages_layout: classic